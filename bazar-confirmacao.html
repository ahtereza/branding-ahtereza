<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Confirmado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 32px 24px;
      max-width: 448px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #111111;
      margin-bottom: 20px;
    }
    p {
      font-size: 14px;
      color: #555555;
      line-height: 1.8;
    }
    .label {
      font-weight: 600;
      color: #333333;
      margin-top: 16px;
      display: block;
    }
    .suporte {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      font-size: 13px;
      color: #888888;
    }
    .suporte a {
      color: #111111;
      font-weight: 600;
      text-decoration: none;
    }
    .suporte a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Convite Confirmado!</h1>
    <p>
      <span class="label">Endereço:</span>
      Av. Nossa Sra. Copacabana 1072,<br>
      Sala 803 (RJ, 22060-002)
    </p>
    <p>
      <span class="label">Referências:</span>
      - Esquina com Djalma Ulrich<br>
      - Estação metrô: Canta Galo<br>
      - Copacabana Posto 5
    </p>
    <div class="suporte">
      Dúvidas? Fale com a gente pelo<br>
      <a href="https://wa.me/5521995717891?text=Ol%C3%A1%2C%20tudo%20bem%3F%20Preciso%20de%20ajuda%20sobre%20o%20bazar%20presencial" target="_blank">WhatsApp</a>
    </div>
  </div>
</body>
</html>
